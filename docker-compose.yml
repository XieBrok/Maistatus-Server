services:
  maistatus-api:
    build: .
    container_name: maistatus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STATUS_DB_PATH: /data/status.db
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    init: true
