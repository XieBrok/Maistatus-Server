# Add this location block INSIDE the existing HTTPS server {} block for your domain.
# App upload endpoint:
#   https://YOUR_DOMAIN/maistatus/api/v1/events
# Admin page:
#   https://YOUR_DOMAIN/maistatus/admin/devices
# The trailing slash on proxy_pass maps /maistatus/<path> to /<path>.
location /maistatus/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}
